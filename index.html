<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceVote | Science Fair</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg,#08152e,#102b50,#075985);
  color: #fff;
  padding: 25px 15px;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 30px;
  border: 1px solid #ffffff25;
  border-radius: 24px;
  background: #ffffff12;
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 60px #0005;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.logo {
  font-size: 35px;
  font-weight: 800;
  color: #67e8f9;
}

.header p {
  color: #cbd5e1;
  margin-top: 8px;
}

label {
  display: block;
  font-weight: 600;
  margin: 20px 0 9px;
}

select, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #ffffff30;
  background: #102b50;
  color: white;
  font-size: 15px;
  outline: none;
}

select:focus, textarea:focus {
  border-color: #67e8f9;
}

select option {
  background: #102b50;
  color: white;
}

select:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

#catalogStatus {
  color: #cbd5e1;
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
}

textarea {
  resize: vertical;
  min-height: 130px;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 15px;
}

button {
  border: none;
  padding: 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

.record {
  flex: 1;
  background: #0891b2;
  color: white;
}

.stop {
  flex: 1;
  background: #334155;
  color: white;
}

.submit {
  width: 100%;
  margin-top: 25px;
  background: linear-gradient(90deg,#06b6d4,#2563eb);
  color: white;
  font-size: 17px;
}

.stars {
  display: flex;
  gap: 12px;
  font-size: 38px;
  margin-top: 10px;
}

.star {
  cursor: pointer;
  color: #64748b;
}

.star.active {
  color: #facc15;
}

#status {
  text-align: center;
  margin-top: 18px;
  color: #a5f3fc;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  margin-top: 25px;
}

@media(max-width:500px) {
  .container { padding: 22px 17px; }
  .stars { font-size: 34px; }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">VoiceVote</div>
    <h2>Science Fair Feedback</h2>
    <p>Your voice matters. Share your experience!</p>
  </div>

  <label for="studentClass">Select Class</label>
  <select id="studentClass">
    <option value="">Choose Class</option>
    <option value="6">Class 6</option>
    <option value="7">Class 7</option>
    <option value="8">Class 8</option>
    <option value="9">Class 9</option>
    <option value="10">Class 10</option>
  </select>

  <label for="section">Select Section</label>
  <select id="section" disabled>
    <option value="">Select class first</option>
  </select>

  <label for="project">Select Project</label>
  <select id="project" disabled>
    <option value="">Select class and section first</option>
  </select>
  <p id="catalogStatus" role="status" aria-live="polite">Loading available projects…</p>

  <label for="language">Feedback Language</label>
  <select id="language">
    <option value="en-IN">English</option>
    <option value="te-IN">Telugu</option>
    <option value="hi-IN">Hindi</option>
    <option value="ta-IN">Tamil</option>
    <option value="kn-IN">Kannada</option>
  </select>

  <label>Voice Feedback</label>

  <div class="buttons">
    <button class="record" id="startBtn" onclick="startRecording()">🎙 Start</button>
    <button class="stop" onclick="stopRecording()">■ Stop</button>
  </div>

  <label for="feedback">Your Feedback</label>
  <textarea id="feedback" placeholder="Speak or type your feedback here..."></textarea>

  <label>Rate the Project</label>
  <div class="stars" id="stars">
    <span class="star" data-value="1">★</span>
    <span class="star" data-value="2">★</span>
    <span class="star" data-value="3">★</span>
    <span class="star" data-value="4">★</span>
    <span class="star" data-value="5">★</span>
  </div>

  <button class="submit" id="submitBtn" onclick="submitFeedback()" disabled>
    Submit Feedback →
  </button>

  <div id="status"></div>

  <div class="footer">
    VoiceVote • Smart Science Fair Feedback System
  </div>

</div>

<script src="voicevote-catalog.js"></script>
<script>
// Google Apps Script web app URL. Use exactly one /exec suffix.
//    Do NOT use the Deployment ID, Library URL, Apps Script editor URL or Google Sheet URL.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk-Ex6bd0l3V9fiUrPoCGVHNmkUAm_4yY7xlGLHWFRZBSn6lCo0Pw0vZ0C-vgyIC26/exec";

const classSelect = document.getElementById("studentClass");
const sectionSelect = document.getElementById("section");
const projectSelect = document.getElementById("project");
const submitButton = document.getElementById("submitBtn");
const statusElement = document.getElementById("status");
const catalogStatus = document.getElementById("catalogStatus");

function hasValidWebAppUrl() {
  return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(SCRIPT_URL.trim());
}

// Preserve the application's familiar "Class 6", "Class 7", etc. labels.
function updateGradeLabels() {
  Array.from(classSelect.options).forEach(function(option) {
    if (/^\d+$/.test(option.value)) option.textContent = "Class " + option.value;
  });
}

// Friendly "Section A" labels when the roster uses simple A/B/C values.
// Keep raw option values exactly as they appear in the Projects sheet.
function updateSectionLabels() {
  Array.from(sectionSelect.options).forEach(function(option) {
    if (/^[A-Za-z]$/.test(option.value)) option.textContent = "Section " + option.value.toUpperCase();
  });
}

let catalogReady = false;
function startCatalog() {
  classSelect.disabled = true;
  if (!hasValidWebAppUrl()) {
    catalogStatus.textContent = "Setup needed: paste the Google Apps Script Web app /exec URL into index.html.";
    return;
  }
  if (!window.VoiceVoteCatalogSelector) {
    catalogStatus.textContent = "Could not load voicevote-catalog.js. Check that it is beside index.html.";
    return;
  }
  VoiceVoteCatalogSelector.init({
    apiUrl: SCRIPT_URL.trim(),
    gradeSelector: "#studentClass",
    sectionSelector: "#section",
    projectSelector: "#project",
    statusSelector: "#catalogStatus",
    preserveExistingGrades: false
  }).then(function() {
    catalogReady = true;
    submitButton.disabled = false;
    updateGradeLabels();
  }).catch(function(error) {
    catalogStatus.textContent = "Unable to load projects: " + error.message + " Refresh after checking your Projects sheet and deployment.";
    console.error("VoiceVote project catalog error:", error);
  });
}

// Initialize the catalog first so its filtering runs before label formatting.
startCatalog();
classSelect.addEventListener("change", updateSectionLabels);

let rating = 0;
let recognition = null;
let isRecording = false;
let isSubmitting = false;

document.querySelectorAll(".star").forEach(function(star) {
  star.addEventListener("click", function() {
    rating = Number(this.dataset.value);
    document.querySelectorAll(".star").forEach(function(item) {
      item.classList.toggle("active", Number(item.dataset.value) <= rating);
    });
  });
});

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusElement.textContent = "Speech recognition is not supported in this browser. Please type your feedback.";
    return;
  }
  if (isRecording || isSubmitting) return;

  recognition = new SpeechRecognition();
  recognition.lang = document.getElementById("language").value;
  recognition.continuous = true;
  recognition.interimResults = true;
  let finalTranscript = document.getElementById("feedback").value.trim();

  recognition.onresult = function(event) {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += (finalTranscript ? " " : "") + transcript;
      } else {
        interim += transcript;
      }
    }
    document.getElementById("feedback").value = finalTranscript + (interim ? " " + interim : "");
  };

  recognition.onerror = function(event) {
    if (!isSubmitting) statusElement.textContent = "Voice error: " + event.error + ". Check browser microphone permission.";
    isRecording = false;
  };
  recognition.onend = function() {
    isRecording = false;
    if (!isSubmitting) statusElement.textContent = "Recording stopped.";
  };
  try {
    recognition.start();
    isRecording = true;
    statusElement.textContent = "Listening...";
  } catch (error) {
    statusElement.textContent = "Could not start recording: " + error.message;
  }
}

function stopRecording() {
  if (recognition && isRecording) recognition.stop();
}

// The supplied Apps Script source exposes doGet(action=save) with a JSONP callback,
// NOT a JSON POST endpoint. Wait for an explicit success response before clearing.
function saveFeedback(data) {
  return new Promise(function(resolve, reject) {
    const callback = "voiceVoteSave_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const tag = document.createElement("script");
    let settled = false;
    const timer = setTimeout(function() {
      finish(new Error("No save confirmation received. Check the Feedback sheet before retrying; the first request may have been saved."));
    }, 30000);

    function finish(error, response) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      delete window[callback];
      tag.remove();
      if (error) reject(error);
      else resolve(response);
    }

    window[callback] = function(response) {
      if (response && response.success === true) finish(null, response);
      else finish(new Error((response && response.message) || "The backend did not confirm the save."));
    };
    tag.onerror = function() { finish(new Error("Cannot reach Apps Script. Check the Feedback sheet before retrying; the request may have been saved.")); };
    tag.onload = function() {
      if (!settled) finish(new Error("Apps Script returned no valid save confirmation. Check the Feedback sheet before retrying; the request may have been saved."));
    };

    const params = new URLSearchParams({
      action: "save",
      studentClass: data.studentClass,
      section: data.section,
      project: data.project,
      feedback: data.feedback,
      language: data.language,
      rating: String(data.rating),
      callback: callback
    });
    const connector = SCRIPT_URL.includes("?") ? "&" : "?";
    tag.src = SCRIPT_URL.trim() + connector + params.toString();
    document.head.appendChild(tag);
  });
}

async function submitFeedback() {
  if (isSubmitting) return;
  const data = {
    studentClass: classSelect.value,
    section: sectionSelect.value,
    project: projectSelect.value,
    language: document.getElementById("language").value,
    feedback: document.getElementById("feedback").value.trim(),
    rating: rating
  };

  if (!catalogReady) {
    statusElement.textContent = "The project list is not ready. Check the project status above.";
    return;
  }
  if (!data.studentClass || !data.section || !data.project || !data.feedback || !data.rating) {
    statusElement.textContent = "Please choose a class, section and project, enter feedback, and select a star rating.";
    return;
  }
  if (!hasValidWebAppUrl()) {
    statusElement.textContent = "Please configure the Apps Script /exec URL first.";
    return;
  }

  isSubmitting = true;
  stopRecording();
  submitButton.disabled = true;
  submitButton.textContent = "Submitting...";
  statusElement.textContent = "Saving feedback…";

  try {
    await saveFeedback(data);
    statusElement.textContent = "Thank you! Your feedback was saved successfully.";
    document.getElementById("feedback").value = "";
    classSelect.value = "";
    classSelect.dispatchEvent(new Event("change", { bubbles: true }));
    rating = 0;
    document.querySelectorAll(".star").forEach(function(star) { star.classList.remove("active"); });
  } catch (error) {
    statusElement.textContent = "Submission not confirmed: " + error.message;
  } finally {
    isSubmitting = false;
    submitButton.disabled = !catalogReady;
    submitButton.textContent = "Submit Feedback →";
  }
}
</script>

</body>
</html>
