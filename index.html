
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceVote | Science Fair</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg,#08152e,#102b50,#075985);
  color: #fff;
  padding: 25px 15px;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 30px;
  border: 1px solid #ffffff25;
  border-radius: 24px;
  background: #ffffff12;
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 60px #0005;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.logo {
  font-size: 35px;
  font-weight: 800;
  color: #67e8f9;
}

.header p {
  color: #cbd5e1;
  margin-top: 8px;
}

label {
  display: block;
  font-weight: 600;
  margin: 20px 0 9px;
}

select, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #ffffff30;
  background: #102b50;
  color: white;
  font-size: 15px;
  outline: none;
}

select:focus, textarea:focus {
  border-color: #67e8f9;
}

select option {
  background: #102b50;
  color: white;
}

textarea {
  resize: vertical;
  min-height: 130px;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 15px;
}

button {
  border: none;
  padding: 14px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

.record {
  flex: 1;
  background: #0891b2;
  color: white;
}

.stop {
  flex: 1;
  background: #334155;
  color: white;
}

.submit {
  width: 100%;
  margin-top: 25px;
  background: linear-gradient(90deg,#06b6d4,#2563eb);
  color: white;
  font-size: 17px;
}

.stars {
  display: flex;
  gap: 12px;
  font-size: 38px;
  margin-top: 10px;
}

.star {
  cursor: pointer;
  color: #64748b;
}

.star.active {
  color: #facc15;
}

#status {
  text-align: center;
  margin-top: 18px;
  color: #a5f3fc;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #94a3b8;
  font-size: 12px;
  margin-top: 25px;
}

@media(max-width:500px) {
  .container { padding: 22px 17px; }
  .stars { font-size: 34px; }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">VoiceVote</div>
    <h2>Science Fair Feedback</h2>
    <p>Your voice matters. Share your experience!</p>
  </div>

  <label for="studentClass">Select Class</label>
  <select id="studentClass">
    <option value="">Choose Class</option>
    <option value="6">Class 6</option>
    <option value="7">Class 7</option>
    <option value="8">Class 8</option>
    <option value="9">Class 9</option>
    <option value="10">Class 10</option>
  </select>

  <label for="section">Select Section</label>
  <select id="section">
    <option value="">Choose Section</option>
  </select>

  <label for="project">Select Project</label>
  <select id="project">
    <option value="">Choose Project</option>
    <option>Solar Energy Model</option>
    <option>Rainwater Harvesting</option>
    <option>Smart Irrigation System</option>
    <option>Water Purification</option>
    <option>Electricity Generation</option>
  </select>

  <label for="language">Feedback Language</label>
  <select id="language">
    <option value="en-IN">English</option>
    <option value="te-IN">Telugu</option>
    <option value="hi-IN">Hindi</option>
    <option value="ta-IN">Tamil</option>
    <option value="kn-IN">Kannada</option>
  </select>

  <label>Voice Feedback</label>

  <div class="buttons">
    <button class="record" id="startBtn" onclick="startRecording()">🎙 Start</button>
    <button class="stop" onclick="stopRecording()">■ Stop</button>
  </div>

  <label for="feedback">Your Feedback</label>
  <textarea id="feedback" placeholder="Speak or type your feedback here..."></textarea>

  <label>Rate the Project</label>
  <div class="stars" id="stars">
    <span class="star" data-value="1">★</span>
    <span class="star" data-value="2">★</span>
    <span class="star" data-value="3">★</span>
    <span class="star" data-value="4">★</span>
    <span class="star" data-value="5">★</span>
  </div>

  <button class="submit" id="submitBtn" onclick="submitFeedback()">
    Submit Feedback →
  </button>

  <div id="status"></div>

  <div class="footer">
    VoiceVote • Smart Science Fair Feedback System
  </div>

</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

const sections = {
  "6": ["A","B","C"],
  "7": ["A","B","C"],
  "8": ["A","B","C"],
  "9": ["A","B","C"],
  "10": ["A","B","C"]
};

const classSelect = document.getElementById("studentClass");
const sectionSelect = document.getElementById("section");

classSelect.addEventListener("change", function() {
  sectionSelect.innerHTML = '<option value="">Choose Section</option>';

  (sections[this.value] || []).forEach(function(section) {
    const option = document.createElement("option");
    option.value = section;
    option.textContent = "Section " + section;
    sectionSelect.appendChild(option);
  });
});

let rating = 0;
let recognition = null;
let isRecording = false;

document.querySelectorAll(".star").forEach(function(star) {
  star.addEventListener("click", function() {
    rating = Number(this.dataset.value);

    document.querySelectorAll(".star").forEach(function(item) {
      item.classList.toggle(
        "active",
        Number(item.dataset.value) <= rating
      );
    });
  });
});

function startRecording() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("status").textContent =
      "Speech recognition is not supported in this browser. Please type your feedback.";
    return;
  }

  if (isRecording) return;

  recognition = new SpeechRecognition();
  recognition.lang = document.getElementById("language").value;
  recognition.continuous = true;
  recognition.interimResults = true;

  let finalTranscript = document.getElementById("feedback").value.trim();

  recognition.onresult = function(event) {
    let interim = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalTranscript += (finalTranscript ? " " : "") + transcript;
      } else {
        interim += transcript;
      }
    }

    document.getElementById("feedback").value =
      finalTranscript + (interim ? " " + interim : "");
  };

  recognition.onerror = function(event) {
    document.getElementById("status").textContent =
      "Voice error: " + event.error +
      ". Check browser microphone permission.";
    isRecording = false;
  };

  recognition.onend = function() {
    isRecording = false;
    document.getElementById("status").textContent = "Recording stopped.";
  };

  try {
    recognition.start();
    isRecording = true;
    document.getElementById("status").textContent = "Listening...";
  } catch(error) {
    document.getElementById("status").textContent =
      "Could not start recording: " + error.message;
  }
}

function stopRecording() {
  if (recognition && isRecording) {
    recognition.stop();
  }
}

async function submitFeedback() {
  const data = {
    studentClass: classSelect.value,
    section: sectionSelect.value,
    project: document.getElementById("project").value,
    language: document.getElementById("language").value,
    feedback: document.getElementById("feedback").value.trim(),
    rating: rating
  };

  if (!data.studentClass || !data.section ||
      !data.project || !data.feedback || !data.rating) {
    alert("Please complete all fields and select a star rating.");
    return;
  }

  if (!SCRIPT_URL.startsWith("https://script.google.com/")) {
    alert("Please add your Google Apps Script Web App URL first.");
    return;
  }

  stopRecording();

  const button = document.getElementById("submitBtn");
  button.disabled = true;
  button.textContent = "Submitting...";

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });

    document.getElementById("status").textContent =
      "Thank you! Your feedback has been submitted.";

    document.getElementById("feedback").value = "";
    document.getElementById("studentClass").value = "";
    document.getElementById("section").innerHTML =
      '<option value="">Choose Section</option>';
    document.getElementById("project").value = "";
    rating = 0;

    document.querySelectorAll(".star").forEach(function(star) {
      star.classList.remove("active");
    });

  } catch(error) {
    document.getElementById("status").textContent =
      "Submission failed. Please try again.";
  }

  button.disabled = false;
  button.textContent = "Submit Feedback →";
}
</script>

</body>
</html>
