name: Sync public VoiceVote project catalog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-projects.mjs'
      - 'scripts/catalog-integrity.mjs'
      - '.github/workflows/sync-projects.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: voicevote-project-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public Apps Script catalog and update local JSON
        run: node scripts/sync-projects.mjs
      - name: Run in-memory project integrity tests
        run: node --test test/catalog-integrity.test.js
      - name: Open or update catalog change pull request (never push directly to main)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/voicevote-catalog-refresh
          base: main
          add-paths: projects.json
          delete-branch: true
          commit-message: "chore: refresh public Projects catalog snapshot"
          title: "VoiceVote: review public project catalog refresh"
          body: |
            Automatically reconciled from the read-only Apps Script catalog.
            Check project additions, renames and deactivations before merging.
            The sync refuses missing or conflicting stable IDs.
            No voting records, feedback data or Apps Script settings were changed.
