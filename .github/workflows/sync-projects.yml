name: Sync public VoiceVote project catalog

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-projects.mjs'
      - '.github/workflows/sync-projects.yml'

permissions:
  contents: write

concurrency:
  group: voicevote-project-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read public Apps Script catalog and update local JSON
        run: node scripts/sync-projects.mjs
      - name: Commit changed snapshot only
        run: |
          set -euo pipefail
          git add projects.json
          if git diff --cached --quiet; then
            echo 'Catalog unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public Projects catalog snapshot'
          git push origin HEAD:main
