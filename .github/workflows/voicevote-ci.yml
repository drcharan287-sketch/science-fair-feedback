name: VoiceVote tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend / backend contract tests
        run: |
          node --test
          node --check scripts/smoke-catalog.mjs
          node --check scripts/sync-projects.mjs
          node --check scripts/catalog-integrity.mjs
          node --check scripts/verify-post-probe.mjs
          node --check scripts/verify-hosted-search.mjs
          node --check scripts/verify-speech-readiness.mjs
          node --check scripts/wait-for-pages.mjs
          node --check scripts/verify-post-form-dry-run.mjs
          node --check scripts/verify-recovery-readiness.mjs
          node --check scripts/verify-results-ui.mjs
          node --check results.js
          node --check scripts/verify-owner-demo.mjs
          node --check scripts/verify-admin-manager-ui.mjs
          node --check scripts/verify-long-feedback-ui.mjs
          node --check scripts/verify-voice-project-search.mjs
          node --check scripts/verify-live-project-manager.mjs
          node --check scripts/verify-translation-preview.mjs
          node --check scripts/verify-live-translation-preview.mjs
          node --check scripts/verify-ios-translation-fallback.mjs
          node --check scripts/smoke-public-results.mjs
          node -e "const p=require('./projects.json'); if(!p.success || !Array.isArray(p.projects) || !p.projects.length) process.exit(1)"
      - name: Verify staged Voting owner demo and Results in isolated Chromium before deployment
        run: |
          npm install --no-save playwright-core
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/voicevote-staging-http.log 2>&1 &
          export VOICEVOTE_SITE_BASE=http://127.0.0.1:8787/
          node scripts/verify-owner-demo.mjs
          node scripts/verify-admin-manager-ui.mjs
          node scripts/verify-long-feedback-ui.mjs
          node scripts/verify-voice-project-search.mjs
          node scripts/verify-results-ui.mjs
          node scripts/verify-translation-preview.mjs
          node scripts/verify-ios-translation-fallback.mjs
