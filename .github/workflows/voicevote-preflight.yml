name: VoiceVote candidate branch preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voicevote-preflight.yml'
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Branch or commit to check'
        required: true
        default: 'fix/voicevote-form-post-ui'
        type: string

permissions:
  contents: read

jobs:
  test-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || '3a8998c2eeac4cf391fe73720f20f5253583988d' }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full VoiceVote tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test
          node --check scripts/verify-post-probe.mjs
          node --check scripts/smoke-catalog.mjs
          node --check scripts/verify-hosted-ui.mjs
