name: Verify VoiceVote in real browser
# GitHub's dynamic Pages deployment does not reliably emit workflow_run for
# downstream workflows. Run on source changes and explicitly wait for the live
# published HTML to match the current checkout before testing.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'results.html'
      - 'results.css'
      - 'results.js'
      - 'voicevote-theme.css'
      - 'voicevote-catalog.js'
      - 'projects.json'
      - 'scripts/verify-*.mjs'
      - 'scripts/wait-for-pages.mjs'
      - '.github/workflows/verify-live-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait until GitHub Pages serves this exact source (read-only)
        run: node scripts/wait-for-pages.mjs
      - name: Install headless browser driver
        run: npm install --no-save playwright-core
      - name: Verify hosted project catalog and selection in Chromium
        run: node scripts/verify-hosted-ui.mjs
      - name: Verify hosted quick search, lockout and deferred passes without voting
        run: node scripts/verify-hosted-search.mjs
      - name: Intercept feedback POST locally instead of contacting Google
        run: node scripts/verify-post-form-dry-run.mjs
      - name: Simulate English Telugu Hindi recognition and phone layouts, without saving
        run: node scripts/verify-speech-readiness.mjs
      - name: Verify offline catalog, Back/Refresh and interrupted receipt recovery without saving
        run: node scripts/verify-recovery-readiness.mjs
      - name: Verify smart-board and phone Results modes with all backend calls intercepted
        run: node scripts/verify-results-ui.mjs
      - name: Verify owner-only demonstration uses real Voting UI without writing feedback
        run: node scripts/verify-owner-demo.mjs
      - name: Verify corrected live speech preview on parent and owner page without real vote submission
        run: node scripts/verify-translation-preview.mjs
      - name: Verify top-level no-vote iPhone Chrome-like translation fallback (emulated, not native iOS)
        run: node scripts/verify-ios-translation-fallback.mjs
      - name: Verify actual Google English translation for Telugu Hindi Tamil Kannada and fallback (no-save)
        run: node scripts/verify-live-translation-preview.mjs
