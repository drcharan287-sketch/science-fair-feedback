name: Verify VoiceVote in real browser
# Browser checks must start after the hosted Pages deploy, never race the build.

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser driver
        run: npm install --no-save playwright-core
      - name: Check live site and dependent selections in Chromium
        run: node scripts/verify-hosted-ui.mjs
      - name: Intercept live feedback POST and inspect request without sending it
        run: node scripts/verify-post-form-dry-run.mjs
      - name: Simulate English Telugu Hindi speech and mobile layouts without voting
        run: node scripts/verify-speech-readiness.mjs
